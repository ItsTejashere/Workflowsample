
name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
       name:
            description: 'Name'
            type: string
            required: true
            default: Tejas
       age:
            description: 'Age'
            type: number
            required: true
       gender:
            description: 'Gender'
            type: choice
            options:
            -   Male
            -   Female
    
       married:
            description: "is Married ?"
            type: boolean
        
        

jobs:
  manual:
    runs-on: ubuntu-latest

    steps:
      - name: Greetings
            run: echo "Hi ${{inputs.name}}"
      - name: Age
            run: echo "Your age is ${{inputs.age}}"
      - name:Gender
            run: echo "Your Gender is ${{inputs.gender}}"
      - name:is married
            run: echo "you are ${{inputs.married}}"
