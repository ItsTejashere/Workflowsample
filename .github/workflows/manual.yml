
name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
       name:
            description: 'Name'
            type: string
            required: true
            default: Tejas
       age:
            description: 'Age'
            type: number
            required: true
    
      
        
        

jobs:
  manual:
    runs-on: ubuntu-latest

    steps:
      - name: Greetings
        run: echo "Hi ${{inputs.name}}"
      - name: Age
        run: echo "Your age is ${{inputs.age}}"
