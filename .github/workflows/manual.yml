
name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
       name:
            description: 'Name'
            type: string
            default: "Hello From Inputs"
       age:
            description: 'Age'
            type: number
            required: true
    
      
        
        

jobs:
  manual:
    runs-on: ubuntu-latest

    steps:
      - name: Greetings
        run: echo "Hello ${{inputs.name}} your age is ${{inputs.age}}"
       
