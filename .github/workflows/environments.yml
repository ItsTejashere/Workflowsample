name: Multiple Environments

on:
  workflow_dispatch:

jobs:
  DEV:
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: From dev
        run: |
          echo "Hello, from dev world" >>$GITHUB_STEP_SUMMARY
          echo "User is ${{vars.UNAME}}" >>$GITHUB_STEP_SUMMARY

  STAGE:
    needs:
      - DEV
    environment: STAGE
    runs-on: ubuntu-latest
    steps:
      - name: From stage
        run: |
          echo "Hello, from Stage world" >>$GITHUB_STEP_SUMMARY
          echo "User is ${{vars.UNAME}}" >>$GITHUB_STEP_SUMMARY

  PROD:
    needs:
      - STAGE
    environment: PROD
    runs-on: ubuntu-latest
    steps:
      - name: From prod
        run: |
          echo "Hello, from Prod world"  >>$GITHUB_STEP_SUMMARY
          echo "User is ${{vars.UNAME}}" >>$GITHUB_STEP_SUMMARY
