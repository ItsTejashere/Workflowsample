
name: Multiple Environments

on:
  workflow_dispatch:

jobs:
  DEV:
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: From dev
        run: |
          echo "Hello, from dev world"
          echo "User is ${{vars.UNAME}}"

  STAGE:
    needs:
      - DEV
    environment: STAGE
    runs-on: ubuntu-latest
    steps:
      - name: From stage
        run: |
          echo "Hello, from Stage world"
          echo "User is ${{vars.UNAME}}"

  PROD:
    needs:
      - STAGE
    environment: PROD
    runs-on: ubuntu-latest
    steps:
      - name: From prod
        run: |
          echo "Hello, from Prod world"
          echo "User is ${{vars.UNAME}}"
