name: Composite action used and installed the node.js and python

on:
  workflow_dispatch:

jobs:
  installation:
    runs-on: ubuntu-latest

    steps:
      - name: Install Node.js & Python
        id: env-vars
        uses: ItsTejashere/Composite-action-with-input-and-outputs@v1
        with:
          python-version: '3.10'
          node-version: '18.20.4'

      - name: Display Repository Owner
        run: echo "Repo Owner = ${{ steps.env-vars.outputs.repo-owner }} "
